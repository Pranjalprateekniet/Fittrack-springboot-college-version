spring.application.name=fittrackv2

# ===============================
# Database Configuration (MySQL)
# ===============================
# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/fittrackv2?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=fittrack_user
spring.datasource.password=FitTrack_DB_2026_Strong
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# Server Configuration
# ===============================
server.port=8080

# ===============================
# JWT Configuration
# ===============================
jwt.secret=${JWT_SECRET:}

# ===============================
# Logging Configuration
# ===============================
logging.level.org.springframework.security=INFO
logging.level.com.pranjal.fittrackv2=INFO

# ===============================
# Thymeleaf Configuration
# ===============================
spring.thymeleaf.cache=false