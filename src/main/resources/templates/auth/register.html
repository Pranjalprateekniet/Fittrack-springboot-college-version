<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | FitTrack V2</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <link rel="stylesheet" th:href="@{/css/auth.css}" />
</head>
<body class="auth-page">

<div class="auth-card">
  <div class="auth-brand">
    <h1>FitTrack V2</h1>
    <p>Create your account to start tracking</p>
  </div>

  <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

  <form th:action="@{/register}" method="post">
    <div class="form-group">
      <label for="fullName">Full Name</label>
      <input id="fullName" name="fullName" type="text" class="form-control" th:value="${fullName}" placeholder="John Doe" required minlength="2" maxlength="100" />
    </div>

    <div class="form-group">
      <label for="email">Email Address</label>
      <input id="email" name="email" type="email" class="form-control" th:value="${email}" placeholder="student@fittrack.edu" required />
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" class="form-control" placeholder="At least 6 characters" required minlength="6" />
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirm Password</label>
      <input id="confirmPassword" name="confirmPassword" type="password" class="form-control" placeholder="Re-enter password" required minlength="6" />
    </div>

    <button type="submit" class="btn btn-primary auth-btn">Create Account</button>
  </form>

  <div class="auth-footer">
    Already have an account? <a th:href="@{/login}">Sign in</a>
  </div>
</div>

</body>
</html>
