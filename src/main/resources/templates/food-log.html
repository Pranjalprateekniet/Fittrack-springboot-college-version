<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Food Log')}"></head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/layout :: sidebar('food-log')}"></aside>
  <div class="main-area">
    <header th:replace="~{fragments/layout :: topbar('Food Log')}"></header>

    <main class="content">
      <div th:replace="~{fragments/layout :: alerts}"></div>

      <div class="card">
        <div class="card-header">
          <h2 class="card-title">Daily Food Log — <span th:text="${selectedDate}">2026-11-25</span></h2>
          <form th:action="@{/food-log}" method="get" class="inline-actions">
            <input type="date" name="date" th:value="${selectedDate}" class="form-control" />
            <button type="submit" class="btn btn-secondary btn-sm">View Date</button>
          </form>
        </div>

        <div class="stats-grid" style="margin-bottom: 0;">
          <div class="stat-card">
            <div class="stat-label">Calories</div>
            <div class="stat-value" th:text="${#numbers.formatDecimal(summary.totalCalories, 1, 0)} + ' kcal'">0 kcal</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Protein</div>
            <div class="stat-value" th:text="${#numbers.formatDecimal(summary.totalProtein, 1, 1)} + ' g'">0 g</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Carbs</div>
            <div class="stat-value" th:text="${#numbers.formatDecimal(summary.totalCarbs, 1, 1)} + ' g'">0 g</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Fat</div>
            <div class="stat-value" th:text="${#numbers.formatDecimal(summary.totalFat, 1, 1)} + ' g'">0 g</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h3 class="card-title">Add Food to <span th:text="${selectedDate}"></span></h3>
        </div>
        <form th:action="@{/food-log}" method="get" class="inline-actions">
          <input type="hidden" name="date" th:value="${selectedDate}" />
          <input type="text" name="query" th:value="${query}" placeholder="Search food to add (e.g. egg, rice, banana)..." class="form-control" style="max-width: 380px;" required />
          <button type="submit" class="btn btn-primary">Find Food</button>
        </form>

        <div class="table-wrapper" th:if="${!#lists.isEmpty(searchResults)}" style="margin-top: 16px;">
          <table>
            <thead>
              <tr>
                <th>Food</th>
                <th>Calories / Serving</th>
                <th>Quantity (g) &amp; Meal</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="f, iter : ${searchResults}">
                <td>
                  <strong th:text="${f.foodName}">Food</strong>
                  <div class="serving-chips" th:if="${!#lists.isEmpty(f.servings)}">
                    <button type="button" class="chip-btn"
                            th:each="s : ${f.servings}"
                            th:text="${s.displayName} + ' (' + ${#numbers.formatDecimal(s.servingWeightGrams, 1, 0)} + 'g)'"
                            th:attr="data-serving-grams=${s.servingWeightGrams}, data-target-input='log-grams-' + ${iter.index}">
                    </button>
                  </div>
                </td>
                <td th:text="${#numbers.formatDecimal(f.calories, 1, 0)} + ' kcal / ' + ${#numbers.formatDecimal(f.servingSizeG, 1, 0)} + ' g'">0 kcal</td>
                <td>
                  <form th:if="${f.id != null}" th:action="@{/food-log/add}" method="post" class="inline-actions">
                    <input type="hidden" name="foodId" th:value="${f.id}" />
                    <input type="hidden" name="logDate" th:value="${selectedDate}" />
                    <input th:id="'log-grams-' + ${iter.index}" type="number" step="0.1" min="1" name="gramsConsumed" value="100" class="form-control" style="width: 90px;" required />
                    <select name="mealType" class="form-control" style="width: 145px;">
                      <option th:each="m : ${mealTypes}" th:value="${m}" th:text="${m.name().replace('_', ' ')}"></option>
                    </select>
                    <button type="submit" class="btn btn-primary btn-sm">Add Log</button>
                  </form>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h3 class="card-title">Logged Foods</h3>
        </div>

        <div th:if="${#lists.isEmpty(logs)}" class="text-muted">No foods logged for this date.</div>

        <div class="table-wrapper" th:if="${!#lists.isEmpty(logs)}">
          <table>
            <thead>
              <tr>
                <th>Food Name</th>
                <th>Meal Type</th>
                <th>Quantity</th>
                <th>Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <th:block th:each="log : ${logs}">
                <tr>
                  <td th:text="${log.foodName}">Boiled Egg</td>
                  <td><span class="badge" th:text="${log.mealType.name().replace('_', ' ')}">BREAKFAST</span></td>
                  <td th:text="${log.gramsConsumed} + ' g'">100 g</td>
                  <td th:text="${log.logDate}">2026-11-25</td>
                  <td>
                    <div class="inline-actions">
                      <button type="button" class="btn btn-secondary btn-sm" th:attr="data-toggle-edit='edit-log-' + ${log.logId}">Edit</button>
                      <form th:action="@{/food-log/{logId}/delete(logId=${log.logId})}" method="post">
                        <input type="hidden" name="date" th:value="${selectedDate}" />
                        <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                      </form>
                    </div>
                  </td>
                </tr>
                <tr th:id="'edit-log-' + ${log.logId}" style="display:none; background:#f8fafc;">
                  <td colspan="5">
                    <form th:action="@{/food-log/{logId}/update(logId=${log.logId})}" method="post" class="inline-actions">
                      <input type="hidden" name="foodId" th:value="${log.foodId}" />
                      <input type="hidden" name="logDate" th:value="${selectedDate}" />
                      <input type="number" step="0.1" min="1" name="gramsConsumed" th:value="${log.gramsConsumed}" class="form-control" style="width: 110px;" required />
                      <select name="mealType" class="form-control" style="width: 160px;">
                        <option th:each="m : ${mealTypes}" th:value="${m}" th:text="${m.name().replace('_', ' ')}" th:selected="${m == log.mealType}"></option>
                      </select>
                      <button type="submit" class="btn btn-primary btn-sm">Save</button>
                    </form>
                  </td>
                </tr>
              </th:block>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
