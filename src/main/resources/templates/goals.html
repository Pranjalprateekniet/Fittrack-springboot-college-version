<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Fitness Goals')}"></head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/layout :: sidebar('goals')}"></aside>
  <div class="main-area">
    <header th:replace="~{fragments/layout :: topbar('Fitness Goals')}"></header>

    <main class="content">
      <div th:replace="~{fragments/layout :: alerts}"></div>

      <div th:if="${goal != null}" class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">BMI</div>
          <div class="stat-value" th:text="${#numbers.formatDecimal(goal.bmi, 1, 1)}">24.5</div>
          <div class="stat-sub" th:text="${goal.bmiCategory}">NORMAL</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">BMR</div>
          <div class="stat-value" th:text="${goal.bmr != null ? #numbers.formatDecimal(goal.bmr, 1, 0) + ' kcal' : '—'}">1800 kcal</div>
          <div class="stat-sub">Mifflin-St Jeor</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">TDEE</div>
          <div class="stat-value" th:text="${goal.tdee != null ? #numbers.formatDecimal(goal.tdee, 1, 0) + ' kcal' : '—'}">2500 kcal</div>
          <div class="stat-sub">Maintenance Energy</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Target Calories</div>
          <div class="stat-value" th:text="${goal.targetCalories} + ' kcal'">2000 kcal</div>
          <div class="stat-sub" th:text="'P: ' + ${goal.targetProtein} + 'g | C: ' + ${goal.targetCarbohydrates} + 'g | F: ' + ${goal.targetFat} + 'g'">Macros</div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h2 class="card-title" th:text="${goal != null ? 'Update Fitness Goal' : 'Create Fitness Goal'}">Create Fitness Goal</h2>
          <form th:if="${goal != null}" th:action="@{/goals/delete}" method="post">
            <button type="submit" class="btn btn-danger btn-sm">Delete Goal</button>
          </form>
        </div>

        <form th:action="@{/goals}" th:object="${goalRequest}" method="post">
          <div class="form-grid">
            <div class="form-group">
              <label for="goalType">Goal Type</label>
              <select id="goalType" th:field="*{goalType}" class="form-control" required>
                <option th:each="t : ${goalTypes}" th:value="${t}" th:text="${t.name().replace('_', ' ')}"></option>
              </select>
            </div>

            <div class="form-group">
              <label for="goalPace">Goal Pace</label>
              <select id="goalPace" th:field="*{goalPace}" class="form-control" required>
                <option th:each="p : ${goalPaces}" th:value="${p}" th:text="${p.name()}"></option>
              </select>
            </div>

            <div class="form-group">
              <label for="gender">Gender</label>
              <select id="gender" th:field="*{gender}" class="form-control" required>
                <option th:each="g : ${genders}" th:value="${g}" th:text="${g.name()}"></option>
              </select>
            </div>

            <div class="form-group">
              <label for="activityLevel">Activity Level</label>
              <select id="activityLevel" th:field="*{activityLevel}" class="form-control" required>
                <option th:each="a : ${activityLevels}" th:value="${a}" th:text="${a.name().replace('_', ' ')}"></option>
              </select>
            </div>

            <div class="form-group">
              <label for="weightKg">Current Weight (kg)</label>
              <input id="weightKg" type="number" step="0.1" min="30" max="300" th:field="*{weightKg}" class="form-control" required />
            </div>

            <div class="form-group">
              <label for="targetWeightKg">Target Weight (kg)</label>
              <input id="targetWeightKg" type="number" step="0.1" min="30" max="300" th:field="*{targetWeightKg}" class="form-control" required />
            </div>

            <div class="form-group">
              <label for="heightCm">Height (cm)</label>
              <input id="heightCm" type="number" step="0.1" min="100" max="250" th:field="*{heightCm}" class="form-control" required />
            </div>

            <div class="form-group">
              <label for="age">Age (years)</label>
              <input id="age" type="number" min="13" max="100" th:field="*{age}" class="form-control" required />
            </div>
          </div>

          <button type="submit" class="btn btn-primary">Save &amp; Calculate Goal</button>
        </form>
      </div>
    </main>
  </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
