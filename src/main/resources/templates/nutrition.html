<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nutrition Search')}"></head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/layout :: sidebar('nutrition')}"></aside>
  <div class="main-area">
    <header th:replace="~{fragments/layout :: topbar('Nutrition Search')}"></header>

    <main class="content">
      <div th:replace="~{fragments/layout :: alerts}"></div>

      <div class="card">
        <div class="card-header">
          <h2 class="card-title">Search Food Database</h2>
        </div>

        <form th:action="@{/nutrition}" method="get" class="inline-actions">
          <input type="text" name="query" th:value="${query}" placeholder="Search food (e.g. egg, oats, chicken, rice)..." class="form-control" style="max-width: 420px;" required />
          <button type="submit" class="btn btn-primary">Search</button>
        </form>
      </div>

      <div class="card" th:if="${searched}">
        <div class="card-header">
          <h3 class="card-title">Search Results (<span th:text="${#lists.size(results)}">0</span>)</h3>
        </div>

        <div th:if="${#lists.isEmpty(results)}" class="alert alert-info">
          No foods found matching "<span th:text="${query}"></span>". Try a different keyword.
        </div>

        <div class="table-wrapper" th:if="${!#lists.isEmpty(results)}">
          <table>
            <thead>
              <tr>
                <th>Food Name</th>
                <th>Serving</th>
                <th>Calories</th>
                <th>Protein</th>
                <th>Carbs</th>
                <th>Fat</th>
                <th>Fiber</th>
                <th>Log to Today</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="food, iter : ${results}">
                <td>
                  <strong th:text="${food.foodName}">Food</strong>
                  <div class="serving-chips" th:if="${!#lists.isEmpty(food.servings)}">
                    <button type="button" class="chip-btn"
                            th:each="s : ${food.servings}"
                            th:text="${s.displayName} + ' (' + ${#numbers.formatDecimal(s.servingWeightGrams, 1, 0)} + 'g)'"
                            th:attr="data-serving-grams=${s.servingWeightGrams}, data-target-input='grams-' + ${iter.index}">
                    </button>
                  </div>
                </td>
                <td th:text="${#numbers.formatDecimal(food.servingSizeG, 1, 0)} + ' g'">100 g</td>
                <td th:text="${#numbers.formatDecimal(food.calories, 1, 0)} + ' kcal'">0 kcal</td>
                <td th:text="${#numbers.formatDecimal(food.protein, 1, 1)} + ' g'">0 g</td>
                <td th:text="${#numbers.formatDecimal(food.carbs, 1, 1)} + ' g'">0 g</td>
                <td th:text="${#numbers.formatDecimal(food.fat, 1, 1)} + ' g'">0 g</td>
                <td th:text="${#numbers.formatDecimal(food.fiber, 1, 1)} + ' g'">0 g</td>
                <td>
                  <form th:if="${food.id != null}" th:action="@{/food-log/add}" method="post" class="inline-actions">
                    <input type="hidden" name="foodId" th:value="${food.id}" />
                    <input type="hidden" name="logDate" th:value="${today}" />
                    <input th:id="'grams-' + ${iter.index}" type="number" step="0.1" min="1" name="gramsConsumed" value="100" class="form-control" style="width: 85px;" required />
                    <select name="mealType" class="form-control" style="width: 135px;">
                      <option th:each="m : ${mealTypes}" th:value="${m}" th:text="${m.name().replace('_', ' ')}"></option>
                    </select>
                    <button type="submit" class="btn btn-primary btn-sm">Add</button>
                  </form>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
