<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="${title} + ' | FitTrack V2'">FitTrack V2</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <link rel="stylesheet" th:href="@{/css/dashboard.css}" />
</head>
<body>

<aside class="sidebar" th:fragment="sidebar(activePage)">
  <div class="sidebar-brand">FitTrack V2</div>
  <nav class="sidebar-nav">
    <a th:href="@{/dashboard}" th:classappend="${activePage == 'dashboard'} ? 'active'" class="nav-link">Dashboard</a>
    <a th:href="@{/goals}" th:classappend="${activePage == 'goals'} ? 'active'" class="nav-link">Fitness Goals</a>
    <a th:href="@{/workouts}" th:classappend="${activePage == 'workouts'} ? 'active'" class="nav-link">Workouts</a>
    <a th:href="@{/nutrition}" th:classappend="${activePage == 'nutrition'} ? 'active'" class="nav-link">Nutrition Search</a>
    <a th:href="@{/food-log}" th:classappend="${activePage == 'food-log'} ? 'active'" class="nav-link">Food Log</a>
    <a th:href="@{/profile}" th:classappend="${activePage == 'profile'} ? 'active'" class="nav-link">Profile</a>
  </nav>
  <div class="sidebar-footer">
    <form th:action="@{/logout}" method="post">
      <button type="submit" class="btn btn-secondary" style="width: 100%;">Logout</button>
    </form>
  </div>
</aside>

<header class="topbar" th:fragment="topbar(pageTitle)">
  <div class="topbar-title" th:text="${pageTitle}">Dashboard</div>
  <div class="topbar-user">
    <span th:text="${#authentication.name}">user@example.com</span>
  </div>
</header>

<div th:fragment="alerts">
  <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
  <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
</div>

</body>
</html>
